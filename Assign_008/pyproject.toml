[project]
name = "assign-008"
version = "0.1.0"
description = "ERA V5 Session 8 — Attention chronology wall + teaching demos"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pytest>=8",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
