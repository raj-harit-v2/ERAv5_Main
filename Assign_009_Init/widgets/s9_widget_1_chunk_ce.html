<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 9 Widget 1 — Chunked CE</title>
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:13px}
.wrap{max-width:1480px;margin:0 auto;padding:10px 6px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
h1{font-size:19px;margin:2px 0 3px}.sub{color:var(--muted);font-size:11.5px;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 8px 24px rgba(20,42,75,.06)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.bar input[type=range]{width:120px;accent-color:var(--cyan)}
.val{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--cyan)}
.svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px}
.stat b{color:var(--muted);display:block;font-size:10px}
img{max-width:100%;border:1px solid var(--line);border-radius:8px}
</style>
<script src="s9_boot.js"></script>
<script src="s9_engine.js"></script>
</head>
<body>
<main class="wrap">
  <div class="kicker">ERA V5 Session 9</div>
  <h1>Chunked Cross-Entropy — Memory Frontier</h1>
  <p class="sub">Peak logit activation scales with chunk size C, not full sequence T. Harness ratio from <code>seven_numbers.json</code> shown below.</p>
  <div class="card bar">
    <label>Seq T <input id="seqT" type="range" min="512" max="65536" step="512" value="4096"><span class="val" id="seqV">4096</span></label>
    <label>Chunk C <input id="chunkC" type="range" min="128" max="8192" step="128" value="1024"><span class="val" id="chunkV">1024</span></label>
    <label><input id="play" type="checkbox"> Animate chunks</label>
  </div>
  <div class="card"><svg class="svg" id="chunkSvg" viewBox="0 0 800 140"></svg></div>
  <div class="card grid" id="memStats"></div>
    <div class="card"><img id="chunkImg" alt="Chunk frontier plot"></div>
</main>
<script>
(function(){
  var PROXY_V=4096, timer=null, chunkIdx=0;
  var seqEl=document.getElementById("seqT"), chunkEl=document.getElementById("chunkC");
  var seqV=document.getElementById("seqV"), chunkV=document.getElementById("chunkV");

  function peakMib(n,v,bpp){return S9Engine.estimateLogitsBytes(n,v,bpp||4)/(1024*1024);}

  function renderChunkAnim(T,C,active){
    var nChunks=Math.ceil(T/C), barW=760/nChunks, s='<text x="10" y="16" font-size="11" fill="#65758b">'+nChunks+' chunks over T='+T+'</text>';
    for(var i=0;i<nChunks;i++){
      var x=20+i*barW, on=i===active;
      s+='<rect x="'+x+'" y="30" width="'+(barW-4)+'" height="50" rx="4" fill="'+(on?"#0891b2":"#e2e8f0")+'" stroke="#94a3b8"/>';
      s+='<text x="'+(x+barW/2-2)+'" y="58" text-anchor="middle" font-size="9" fill="'+(on?"#fff":"#475569")+'">'+(i*C)+'-'+(Math.min((i+1)*C,T)-1)+'</text>';
    }
    s+='<text x="20" y="110" font-size="11" fill="#65758b">Peak MiB per chunk ≈ '+peakMib(Math.min(C,T),PROXY_V,4).toFixed(2)+' (proxy V='+PROXY_V+')</text>';
    s+='<text x="20" y="128" font-size="11" fill="#65758b">Full materialisation ≈ '+peakMib(T,PROXY_V,4).toFixed(2)+' MiB</text>';
    document.getElementById("chunkSvg").innerHTML=s;
  }

  function render(){
    var T=+seqEl.value, C=+chunkEl.value;
    seqV.textContent=T; chunkV.textContent=C;
    renderChunkAnim(T,C,chunkIdx);
    var ratio=peakMib(T,PROXY_V,4)/Math.max(peakMib(Math.min(C,T),PROXY_V,4),1e-9);
    var html='<div class="stat"><b>Estimated full peak MiB</b>'+peakMib(T,PROXY_V,4).toFixed(3)+'</div>';
    html+='<div class="stat"><b>Estimated chunked peak MiB</b>'+peakMib(Math.min(C,T),PROXY_V,4).toFixed(3)+'</div>';
    html+='<div class="stat"><b>Ratio full/chunked</b>'+ratio.toFixed(2)+'×</div>';
    html+='<div class="stat"><b>Harness ratio (JSON)</b><span id="hRatio">…</span></div>';
    document.getElementById("memStats").innerHTML=html;
    fetch(S9Boot.dataUrl("seven_numbers.json")).then(function(r){return r.json();}).then(function(d){
      document.getElementById("hRatio").textContent=d.ratio_full_over_chunked.toFixed(2)+"× ("+
        d.peak_full_mib.toFixed(2)+" / "+d.peak_chunked_mib.toFixed(2)+" MiB)";
    }).catch(function(){document.getElementById("hRatio").textContent="n/a";});
  }

  S9Boot.showFileWarning();
  seqEl.oninput=render; chunkEl.oninput=function(){chunkIdx=0;render();};
  document.getElementById("play").onchange=function(){
    if(timer){clearInterval(timer);timer=null;}
    if(this.checked){
      var T=+seqEl.value,C=+chunkEl.value,n=Math.ceil(T/C);
      timer=setInterval(function(){chunkIdx=(chunkIdx+1)%n;render();},800);
    }
  };
  try{ document.getElementById("chunkImg").src=S9Boot.reportsUrl("Curriculum_Required_stats_02_chunk_frontier.png"); }catch(e){}
  S9Engine.loadBundle(S9Boot.dataUrl("widget_weights.json")).catch(function(){});
  render();
})();
</script>
</body>
</html>
